# 記事ごとの書誌情報（docx には書かれていない情報）
# python -m jasme_jats 論文.docx --meta examples/meta_example.toml --out output

[article]
volume = "31"            # 巻
issue = "1"              # 号
fpage = "1"              # 開始ページ
lpage = "12"             # 終了ページ
pub_date = "2026-03-31"  # 発行日
# epub_date = "2026-04-24" # J-STAGE 公開日（分かれば）
received = "2025-06-01"  # 受付日
accepted = "2025-11-20"  # 受理日
peer_review = "あり"      # 査読の有無（"あり" / "なし"）
# approved = "2025-11-10" # 最終査読日（査読ありで、分かれば）
# doi = ""               # 空なら 10.24529/jasme.{巻}.{号}_{開始ページ} を使う
keywords = "equity; ジェンダー; 数学教育"  # キーワード（3 個以上。「;」か「；」で区切る。かな・漢字を含むものは日本語のキーワード）
# subject_ja = "論文"     # 原稿種別（日）
# subject_en = "Article"  # 原稿種別（英）
# corresp = [1]          # 責任著者（著者の順番、1 始まり）
# keywords_en = ["equity", "gender"]  # 言語ごとに分けて書くこともできる
