# 記事ごとの書誌情報（docx には書かれていない情報）
# python -m jasme_jats 論文.docx --meta examples/meta_example.toml --out output

# 発行日・受付日・受理日は必須です（どれかが空のまま変換すると、要対応 meta_dates で知らせます。変換は止まらず、終了コードが 1 になります）。
# 出版版 PDF を --pdf で渡すときは、巻・号・開始ページ・終了ページ・受付日・受理日を省けます（PDF の 1 ページ目から読みます。
# 書いた値は PDF と違うと meta_pdf で知らせます（巻・号・ページの違いは要対応、日付などは要確認）。XML に出すのは書いた値です）。
[article]
volume = "31"            # 巻
issue = "1"              # 号
fpage = "1"              # 開始ページ
lpage = "12"             # 終了ページ
pub_date = "2026-03-31"  # 発行日（必須。空のまま変換すると要対応 meta_dates）
# epub_date = "2026-04-24" # J-STAGE 公開日（分かれば）
received = "2025-06-01"  # 受付日（必須。--pdf があれば PDF から入る）
accepted = "2025-11-20"  # 受理日（必須。同上）
peer_review = "あり"      # 査読の有無（"あり" / "なし"）
# approved = "2025-11-10" # 最終査読日（査読ありで、分かれば）
# doi = ""               # 空なら 10.24529/jasme.{巻}.{号}_{開始ページ} を使う
# keywords_ja = "数学教育；活動；哲学"  # キーワード（日本語。任意。「;」か「；」で区切る）
# keywords_en = "mathematics education; activity; philosophy"  # キーワード（英語。任意）
# subject_ja = "論文"     # 原稿種別（日）
# subject_en = "Article"  # 原稿種別（英）
# corresp = [1]          # 責任著者（著者の順番、1 始まり）
