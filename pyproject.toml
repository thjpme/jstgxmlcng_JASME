[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jasme-jats"
version = "0.33.1"
description = "Word（docx）の論文を J-STAGE 全文 XML（JATS 1.1）に変換する。『全国数学教育学会誌 数学教育学研究』用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=4.9",
    "Pillow>=9",
    "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0", "openai>=1.66", "google-genai>=1.30"]
images = ["pypdfium2>=4"]
gui = ["gradio==6.31.0"]    # 1 画面の操作画面（app.py。一般の利用者用）。版は固定する（docs/GUI_PLAN.md の 8 章）
colab = ["markdown>=3.4"]    # Colab で変換レポートを畳んで表示する（colab.report_details）
dev = ["pytest>=7", "anthropic>=1.0", "openai>=1.66", "google-genai>=1.30", "pypdfium2>=4", "markdown>=3.4", "gradio==6.31.0"]

[project.scripts]
jasme-jats = "jasme_jats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jasme_jats = ["data/*.toml", "dtd/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
